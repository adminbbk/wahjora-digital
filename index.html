<style>
:root{
  --bg:#08080a;--s1:#111014;--s2:#17141b;--ink:#f3efe9;--ink2:#e6e0d8;--m1:#cfc9c0;--m2:#b9b3aa;--m3:#8f8981;
  --acc:#ffb35c;--err:#ff8f8f;--ok:oklch(.82 .14 150);
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--line3:rgba(255,255,255,.26);
  --g1:oklch(.78 .16 60);--g2:oklch(.7 .22 355);--g3:oklch(.7 .17 295);
  --grad:linear-gradient(100deg,var(--g1),var(--g2),var(--g3));
  --ease:cubic-bezier(.2,.7,.2,1);--t1:.15s;--t2:.22s;--t3:.3s;
  --fd:'Syne','Noto Kufi Arabic',sans-serif;--fb:'DM Sans','Noto Kufi Arabic',sans-serif;--fm:'JetBrains Mono','Noto Kufi Arabic',monospace;
  --wrap:1320px;--gut:clamp(16px,4vw,56px);--r1:12px;--r2:20px;--r3:28px;--hdr:72px;
  color-scheme:dark
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hdr) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:clip}
img,svg{display:block;max-width:100%}
svg{direction:ltr}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
::placeholder{color:var(--m3)}
::selection{background:#ff8a3d;color:var(--bg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}
h1[tabindex="-1"]:focus{outline:none}
[dir=rtl]{--fm:'Noto Kufi Arabic','JetBrains Mono',monospace}
[dir=rtl] *{letter-spacing:0!important}
[dir=rtl] .h1,[dir=rtl] .h2,[dir=rtl] .hero-t,[dir=rtl] .story-h{line-height:1.3!important}
[dir=rtl] .flip{transform:scaleX(-1)}
.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;inset-inline-start:16px;top:-80px;z-index:200;padding:12px 18px;border-radius:10px;background:var(--ink);color:var(--bg);font:600 14px var(--fb);transition:top var(--t2) var(--ease)}
.skip:focus{top:16px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gut)}
.eyebrow{font:500 12px/1.4 var(--fm);letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.h1{margin:0;font:700 clamp(40px,7vw,96px)/.95 var(--fd);letter-spacing:-.035em;text-wrap:balance}
.h2{margin:0;font:700 clamp(34px,5vw,64px)/1 var(--fd);letter-spacing:-.03em;text-wrap:balance}
.h3{margin:0;font:600 clamp(20px,2vw,24px)/1.2 var(--fd)}
.lead{margin:0;max-width:600px;font-size:clamp(16px,1.4vw,18px);line-height:1.6;color:var(--m2);text-wrap:pretty}
.muted{color:var(--m2)}.dim{color:var(--m3)}.acc{color:var(--acc)}.mono{font-family:var(--fm)}
.grad-t{background:linear-gradient(120deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sec{padding-top:clamp(72px,10vw,120px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.page-head{padding-top:clamp(48px,8vw,112px);padding-bottom:40px;display:flex;flex-direction:column;gap:20px}
.page{animation:pagein .45s var(--ease)}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* buttons & controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:99px;font:600 15px/1 var(--fb);white-space:nowrap;transition:transform var(--t2) var(--ease),box-shadow var(--t2) var(--ease),background var(--t2) var(--ease),border-color var(--t2) var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:progress;transform:none}
.btn-lg{min-height:58px;padding:0 30px;font-size:16px}
.btn-sm{min-height:42px;padding:0 18px;font-size:14px}
.btn-grad{background:var(--grad);color:var(--bg)}
.btn-grad:hover{box-shadow:0 12px 40px oklch(.66 .23 355/.45)}
.btn-light{background:var(--ink);color:var(--bg)}
.btn-ghost{border:1px solid var(--line3)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn .i{font-size:18px}
.link{display:inline-flex;align-items:center;gap:8px;color:var(--acc);font:500 15px var(--fb)}
.link .i,.btn .i-arrow{transition:translate var(--t2) var(--ease)}
.link:hover .i,.btn:hover .i-arrow{translate:4px 0}
[dir=rtl] .link:hover .i,[dir=rtl] .btn:hover .i-arrow{translate:-4px 0}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none;transition:background var(--t2) var(--ease),border-color var(--t2) var(--ease)}
.ibtn:hover{background:rgba(255,255,255,.08);border-color:var(--line3)}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line2);border-radius:99px}
.seg button{padding:8px 14px;border-radius:99px;font:500 13px/1 var(--fb);color:var(--m1);transition:background var(--t2) var(--ease),color var(--t2) var(--ease)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg-lg button{padding:11px 18px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:11px 18px;border-radius:99px;border:1px solid var(--line2);font:500 14px/1 var(--fb);transition:background var(--t2) var(--ease),color var(--t2) var(--ease),border-color var(--t2) var(--ease)}
.chip:hover{border-color:rgba(255,255,255,.5)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;padding:8px 14px;border-radius:99px;border:1px solid var(--line2);font:500 13px var(--fb)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2)}

/* header */
.hdr{position:sticky;top:0;z-index:40;background:rgba(8,8,10,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.hdr-in{height:var(--hdr);display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:baseline;gap:8px;flex:none}
.logo b{font:800 22px/1 var(--fd);letter-spacing:.02em}
.logo span{font:500 10px/1 var(--fm);letter-spacing:.14em;color:var(--m2)}
.nav{display:flex;gap:2px;margin-inline-start:auto}
.nav a{padding:10px clamp(8px,1vw,14px);border-radius:99px;font:500 14px/1 var(--fb);color:var(--m2);transition:color var(--t2) var(--ease),background var(--t2) var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);background:rgba(255,255,255,.09)}
.menu-btn{display:none}
@media(max-width:1000px){.nav,.hdr .seg,.hdr-cta{display:none!important}.menu-btn{display:inline-flex;margin-inline-start:auto}}
dialog{color:var(--ink)}
.menu-dlg{margin:0;width:100%;max-width:none;height:100%;max-height:none;padding:0;border:0;background:rgba(8,8,10,.985);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.menu-dlg::backdrop{background:transparent}
.menu-dlg[open]{animation:pagein .3s var(--ease)}
.menu-in{display:flex;flex-direction:column;min-height:100%;padding:0 var(--gut) 32px}
.menu-top{display:flex;justify-content:space-between;align-items:center;height:var(--hdr)}
.menu-links{display:flex;flex-direction:column;margin-top:24px}
.menu-links a{font:600 clamp(30px,8vw,44px)/1.25 var(--fd);padding:6px 0;color:var(--m1);border-bottom:1px solid var(--line)}
.menu-links a[aria-current=page]{color:var(--ink)}
.menu-foot{margin-top:auto;padding-top:32px;display:flex;flex-direction:column;gap:16px}

/* hero */
.hero{position:relative;min-height:calc(100svh - var(--hdr));display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-3;background:radial-gradient(40vw 34vw at 74% 36%,oklch(.68 .2 45/.5),transparent 70%),radial-gradient(36vw 32vw at 90% 66%,oklch(.6 .24 350/.42),transparent 70%),radial-gradient(48vw 40vw at 56% 86%,oklch(.5 .2 290/.4),transparent 70%)}
[dir=rtl] .hero-bg{transform:scaleX(-1)}
.hero canvas{position:absolute;inset:0;z-index:-2;width:100%;height:100%;opacity:0;transition:opacity 1.2s var(--ease)}
.hero canvas.on{opacity:1}
.hero-veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(to right,rgba(8,8,10,.9),rgba(8,8,10,.55) 42%,rgba(8,8,10,0) 75%),linear-gradient(to top,var(--bg),rgba(8,8,10,0) 30%)}
[dir=rtl] .hero-veil{background:linear-gradient(to left,rgba(8,8,10,.9),rgba(8,8,10,.55) 42%,rgba(8,8,10,0) 75%),linear-gradient(to top,var(--bg),rgba(8,8,10,0) 30%)}
.hero-in{width:100%;padding-top:96px;padding-bottom:64px;display:flex;flex-direction:column;gap:28px}
.hero-t{margin:0;max-width:12ch;font-family:var(--fd);font-weight:600;font-size:clamp(48px,9vw,136px);line-height:.92;letter-spacing:-.04em;text-wrap:balance}
.hero-sub{color:var(--m1)}
.trust{display:flex;flex-wrap:wrap;gap:10px 22px;font:500 12px/1.4 var(--fm);color:var(--m1)}
.trust li{display:inline-flex;align-items:center;gap:8px}
.trust .i{color:var(--acc);font-size:16px}
.hint{display:flex;align-items:center;gap:10px;font:400 12px var(--fm);color:var(--m3)}
.hint::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc)}
@media(hover:none){.hint{display:none}}


/* hero headline: a sunrise sweep lights the words, "glow" keeps glowing */
.hero-t{font-weight:600}
.js .hero-t{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(100deg,var(--ink) 0 41%,#ffe0a8 45.5%,#ffb35c 48%,#ff6f61 50.5%,#ee3d8a 53%,rgba(122,82,242,.6) 55.5%,rgba(243,239,233,0) 59% 100%);
  background-size:265% 100%;background-position:100% 0}
.js [dir=rtl] .hero-t,[dir=rtl].js .hero-t{background-position:0% 0;background-image:linear-gradient(-100deg,var(--ink) 0 41%,#ffe0a8 45.5%,#ffb35c 48%,#ff6f61 50.5%,#ee3d8a 53%,rgba(122,82,242,.6) 55.5%,rgba(243,239,233,0) 59% 100%)}
.js .hero-t.lit{animation:sunrise 2.8s cubic-bezier(.62,0,.38,1) forwards}
.js [dir=rtl] .hero-t.lit,[dir=rtl].js .hero-t.lit{animation-name:sunrise-rtl}
@keyframes sunrise{to{background-position:0% 0}}
@keyframes sunrise-rtl{to{background-position:100% 0}}
.glowword{position:relative;color:transparent;-webkit-background-clip:text;background-clip:text}
.glowword::after{content:attr(data-t);position:absolute;inset:0;z-index:-1;color:#ff7a50;filter:blur(22px);opacity:0;transition:opacity 1.8s var(--ease);pointer-events:none}
.hero-t.glowing .glowword::after{opacity:.55}
.hero-t.glowing .glowword{background-image:linear-gradient(90deg,var(--ink) 0 22%,#ffb35c 40%,#ff6f61 55%,#ee3d8a 72%,#a77bff 88%,#ffb35c 100%);background-size:420% 100%;background-position:0% 0;
  animation:glowin 1.4s var(--ease) forwards,shimmer 8s 1.4s ease-in-out infinite alternate}
@keyframes glowin{to{background-position:38% 0}}
@keyframes shimmer{from{background-position:38% 0}to{background-position:100% 0}}
.js .hero-in>.eyebrow,.js .hero-in>.hero-sub,.js .hero-in>.row,.js .hero-in>.trust{opacity:0;translate:0 14px}
.js .hero-in.go>.eyebrow,.js .hero-in.go>.hero-sub,.js .hero-in.go>.row,.js .hero-in.go>.trust{opacity:1;translate:0 0;transition:opacity .9s var(--ease) var(--d),translate .9s var(--ease) var(--d)}
.hero-in>.eyebrow{--d:0s}.hero-in>.hero-sub{--d:1.1s}.hero-in>.row{--d:1.3s}.hero-in>.trust{--d:1.5s}
@media(prefers-reduced-motion:reduce){.js .hero-t{color:var(--ink);background:none}.hero-t.glowing .glowword,.glowword{color:var(--acc);background:none;animation:none}.glowword::after{display:none}.js .hero-in>*{opacity:1!important;translate:none!important}}

/* hero reel deck: the first screen shows real work */
.hero-reels{position:absolute;z-index:1;inset-inline-end:clamp(40px,8vw,140px);top:52%;width:clamp(210px,19vw,290px);aspect-ratio:4/5;translate:0 -50%;display:block;--px:0;--py:0;--sp:0}
.hr{position:absolute;inset:0;border-radius:22px;overflow:hidden;border:1px solid var(--line2);background:#111;box-shadow:0 40px 80px -24px rgba(0,0,0,.85);
  transition:transform .9s var(--ease),opacity .9s var(--ease),filter .9s var(--ease);transform-origin:50% 100%;will-change:transform}
.hr img,.hr video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hr video{opacity:0;transition:opacity .5s var(--ease)}
.hr video.live{opacity:1}
.hr[data-s="0"]{z-index:3;transform:translate3d(calc(var(--px)*14px),calc(var(--py)*10px - var(--sp)*30px),0) rotate(calc(var(--px)*2.5deg))}
.hr[data-s="1"]{z-index:2;filter:brightness(.5) saturate(.8);transform:translate3d(calc(-40% - var(--sp)*70px),5%,0) rotate(-9deg) scale(.86)}
.hr[data-s="2"]{z-index:1;filter:brightness(.5) saturate(.8);transform:translate3d(calc(40% + var(--sp)*70px),5%,0) rotate(9deg) scale(.86)}
.hr[data-s="3"]{z-index:0;opacity:0;transform:translate3d(0,8%,0) scale(.78)}
[dir=rtl] .hr[data-s="1"]{transform:translate3d(calc(40% + var(--sp)*70px),5%,0) rotate(9deg) scale(.86)}
[dir=rtl] .hr[data-s="2"]{transform:translate3d(calc(-40% - var(--sp)*70px),5%,0) rotate(-9deg) scale(.86)}
.hr-cap{position:absolute;inset:auto 0 0 0;padding:44px 16px 14px;display:flex;flex-direction:column;gap:2px;background:linear-gradient(to top,rgba(8,8,10,.92),transparent);
  opacity:0;translate:0 8px;transition:opacity .5s var(--ease) .35s,translate .5s var(--ease) .35s}
.hr[data-s="0"] .hr-cap{opacity:1;translate:0 0}
.hr-cap b{font:600 16px/1.2 var(--fd);color:var(--ink)}
.hr-cap small{font:500 11px/1.4 var(--fm);color:var(--m2)}
.hr-tag{position:absolute;z-index:4;top:12px;inset-inline-start:12px;padding:6px 10px;border-radius:99px;background:rgba(8,8,10,.72);border:1px solid var(--line2);font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);pointer-events:none;transition:translate .5s var(--ease)}
.hr-play{position:absolute;z-index:4;inset-inline-end:12px;top:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:15px;pointer-events:none}
.hr-dots{position:absolute;z-index:4;bottom:-26px;inset-inline-start:50%;translate:-50% 0;display:flex;gap:6px}
[dir=rtl] .hr-dots{translate:50% 0}
.hr-dots i{width:6px;height:6px;border-radius:99px;background:var(--line3);transition:width .4s var(--ease),background .4s var(--ease)}
.hr-dots i.on{width:20px;background:var(--acc)}
.hero-reels:hover .hr[data-s="0"]{transform:translate3d(calc(var(--px)*14px),calc(var(--py)*10px - var(--sp)*30px - 8px),0) rotate(calc(var(--px)*2.5deg)) scale(1.03)}
.hero-reels:focus-visible{outline:2px solid var(--acc);outline-offset:10px;border-radius:24px}
@media(max-width:1000px){
  .hero-reels{position:relative;inset:auto;translate:none;align-self:center;width:min(52vw,250px);margin:6px auto 30px}
}
@media(prefers-reduced-motion:reduce){.hr,.hr-cap{transition:none}}

/* landing-page showcase: laptop that tilts up on scroll */
.show{display:grid;gap:clamp(20px,3vw,36px)}
.show-stage{position:relative;perspective:1700px;perspective-origin:50% 0%;padding:clamp(20px,5vh,56px) 0 0;display:grid;place-items:center;isolation:isolate}
.show-glow{position:absolute;inset:4% 6% -6%;z-index:-1;background:radial-gradient(46% 52% at 50% 56%,var(--sg1,#5a1d48),transparent 72%),radial-gradient(30% 30% at 70% 30%,var(--sg2,#e3a33b),transparent 70%);filter:blur(30px);opacity:.75;transition:background 1s var(--ease)}
.dev{--t:0;position:relative;width:min(980px,100%);transform-style:preserve-3d;transform:translateY(calc(var(--t)*-40px)) scale(calc(1 - var(--t)*.16))}
.dev-lid{position:relative;aspect-ratio:16/10;padding:1.4%;border-radius:18px 18px 6px 6px;background:linear-gradient(#1b1a1f,#0c0c0f);border:1px solid var(--line3);
  box-shadow:0 50px 100px -30px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.04);transform-origin:50% 100%;transform:rotateX(calc(var(--t)*64deg));will-change:transform}
.dev-cam{position:absolute;top:.55%;left:50%;width:6px;height:6px;translate:-50% 0;border-radius:50%;background:#2a2a30}
.dev-screen{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#050506}
.dev-screen img,.dev-screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.dev-screen video{opacity:0;transition:opacity .5s var(--ease)}
.dev-screen video.live{opacity:1}
.dev-screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 38%);opacity:calc(.4 + var(--t))}
.dev-tag{top:auto!important;bottom:12px!important;inset-inline-start:auto!important;inset-inline-end:12px!important;z-index:3}
.dev-wipe{position:absolute;inset:0;z-index:2;background:var(--sg2,#e3a33b);clip-path:inset(0 100% 0 0)}
.dev-wipe.go{animation:wipe .8s cubic-bezier(.7,0,.2,1)}
[dir=rtl] .dev-wipe.go{animation-name:wipe-rtl}
@keyframes wipe{0%{clip-path:inset(0 100% 0 0)}48%,52%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
@keyframes wipe-rtl{0%{clip-path:inset(0 0 0 100%)}48%,52%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
.dev-base{position:relative;height:clamp(10px,1.5vw,18px);margin:0 -7%;border-radius:2px 2px 22px 22px/2px 2px 14px 14px;background:linear-gradient(#34333a,#16161a 70%);box-shadow:0 30px 40px -18px rgba(0,0,0,.9)}
.dev-base i{position:absolute;top:0;left:50%;width:15%;height:45%;translate:-50% 0;border-radius:0 0 10px 10px;background:#0e0e11}
.show-ctl{display:flex;align-items:flex-end;justify-content:space-between;gap:20px 32px;flex-wrap:wrap}
.show-tabs{display:flex;gap:6px;padding:5px;border:1px solid var(--line2);border-radius:99px;background:rgba(255,255,255,.02)}
.show-tabs button{display:flex;flex-direction:column;gap:2px;padding:10px 20px;border-radius:99px;text-align:start;transition:background var(--t2) var(--ease),color var(--t2) var(--ease)}
.show-tabs b{font:600 15px/1.1 var(--fd)}
.show-tabs small{font:500 11px/1.2 var(--fm);color:var(--m3);transition:color var(--t2) var(--ease)}
.show-tabs button:hover{background:rgba(255,255,255,.06)}
.show-tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.show-tabs button[aria-selected=true] small{color:rgba(8,8,10,.6)}
.show-info{display:flex;flex-direction:column;gap:14px;max-width:520px}
.show-info p{margin:0;color:var(--m2);font-size:15px;line-height:1.6;min-height:3.2em}
@media(max-width:760px){
  .dev{width:min(290px,74vw);transform:translateY(calc(var(--t)*-30px)) scale(calc(1 - var(--t)*.1))}
  .dev-lid{aspect-ratio:9/19.5;padding:9px;border-radius:42px;transform:rotateX(calc(var(--t)*42deg))}
  .dev-screen{border-radius:34px}
  .dev-cam{top:16px;width:72px;height:20px;border-radius:12px;background:#050506;z-index:4}
  .dev-tag{bottom:22px!important;left:50%!important;right:auto!important;translate:-50% 0}
  .dev-base{display:none}
  .show-tabs{width:100%}.show-tabs button{flex:1;padding:10px 12px}
}

/* marquee */
.marq{overflow:hidden;border-block:1px solid var(--line);padding:22px 0}
.marq-in{display:flex;gap:56px;width:max-content;will-change:transform}
.marq-in span{display:flex;align-items:center;gap:14px;font:600 30px/1 var(--fd);color:var(--m1);white-space:nowrap}
.marq-in span .i{font-size:26px;color:var(--m2)}
.marq-in span::after{content:"";margin-inline-start:42px;width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--g1),var(--g2),var(--g3),var(--g1))}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.stat{padding:clamp(20px,3vw,36px);display:flex;flex-direction:column;gap:10px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat b{font:700 clamp(30px,3.8vw,56px)/1 var(--fd);letter-spacing:-.03em;white-space:nowrap}
.stat span{font-size:14px;color:var(--m2)}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-inline-start:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

/* story */
.story{position:relative;height:340vh}
.story-pin{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));display:flex;align-items:center}
.story-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(20px,5vw,80px);align-items:center;width:100%}
.story-l{display:flex;flex-direction:column;gap:28px}
.story-h{margin:0;font:700 clamp(40px,5vw,68px)/1 var(--fd);letter-spacing:-.03em}
.step{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line);opacity:.32;transition:opacity var(--t3) var(--ease)}
.step.on{opacity:1}
.step-n{font:500 13px/2 var(--fm);color:var(--acc)}
.step-t{display:block;font:600 26px/1.2 var(--fd)}
.step-d{display:block;margin-top:6px;font-size:15px;color:var(--m2)}
.step-viz{display:none}
.bar{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad)}
.story-viz{position:relative;aspect-ratio:4/5;max-height:calc(100vh - 160px);min-width:0;border-radius:var(--r3);overflow:hidden;border:1px solid var(--line2);background:var(--s1);container-type:size}
.story-viz .sv{position:absolute;inset:0;opacity:0;transform:scale(.96);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.story-viz .sv.on{opacity:1;transform:none}
@media(max-width:900px){
  .story{height:auto}.story-pin{position:static;height:auto;padding-top:clamp(72px,10vw,120px)}.story-grid{grid-template-columns:1fr}
  .step-viz .vsvg text{font-size:14px}
  .step{opacity:1;grid-template-columns:1fr;gap:12px}.story-viz,.story .bar{display:none}
  .step-viz{display:block;position:relative;aspect-ratio:16/11;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);background:var(--s1);container-type:size;margin-top:8px}
}

/* coded visuals */
.viz{--c1:oklch(.7 .2 355/.45);--c2:oklch(.75 .16 60/.35);position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);background:radial-gradient(70% 80% at 75% 100%,var(--c1),transparent 70%),radial-gradient(60% 60% at 0% 0%,var(--c2),transparent 70%),var(--s1);container-type:size;isolation:isolate;transition:transform var(--t3) var(--ease),border-color var(--t3) var(--ease)}
.viz::after,.sv::after{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:18px 18px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent);mask-image:linear-gradient(to bottom,#000,transparent)}
.viz.tall{aspect-ratio:4/5}.viz.wide{aspect-ratio:16/10}
.sv{background:radial-gradient(70% 60% at 70% 100%,oklch(.66 .23 355/.35),transparent 70%),radial-gradient(60% 50% at 10% 0%,oklch(.74 .17 55/.22),transparent 70%);isolation:isolate}
.phone{position:absolute;top:7%;bottom:7%;left:50%;translate:-50% 0;aspect-ratio:9/18.5;font-size:4cqh;border-radius:2.6em;background:#050506;padding:.45em;box-shadow:0 40px 80px -20px rgba(0,0,0,.75),inset 0 0 0 1px rgba(255,255,255,.16);rotate:-5deg;transition:rotate var(--t3) var(--ease)}
.case:hover .phone{rotate:-2deg}
.phone-sc{position:relative;height:100%;border-radius:2.2em;overflow:hidden;background:#222}
.phone-sc>svg{position:absolute;inset:0;width:100%;height:100%}
.ph-notch{position:absolute;top:.6em;left:50%;width:34%;height:.9em;translate:-50% 0;border-radius:9px;background:#050506}
.ph-ui{position:absolute;inset-inline-end:.5em;bottom:22%;display:flex;flex-direction:column;align-items:center;gap:.15em;color:#fff;font:600 .7em var(--fb)}
.ph-ui .i{font-size:1.9em;margin-top:.5em}
.ph-cap{position:absolute;inset-inline:.8em 3.2em;bottom:1em;display:flex;flex-direction:column;gap:.4em;color:#fff;font:600 .78em/1.2 var(--fb)}
.ph-cap i{display:block;height:.4em;border-radius:9px;background:rgba(255,255,255,.6)}
.ph-play{position:absolute;top:50%;left:50%;width:3.2em;height:3.2em;translate:-50% -50%;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);display:grid;place-items:center;color:#fff;font-size:1.1em}
.ph-play .i{font-size:1.3em;fill:#fff}
.ph-chip{position:absolute;top:12%;inset-inline-start:-40%;display:flex;flex-direction:column;gap:.25em;padding:.9em 1.2em;border-radius:1.2em;background:rgba(17,16,20,.94);border:1px solid var(--line2);box-shadow:0 20px 40px rgba(0,0,0,.5);rotate:5deg;white-space:nowrap}
.ph-chip bdi{font:700 1.9em/1 var(--fd);color:var(--acc)}
.ph-chip small{font:500 .75em var(--fm);color:var(--m2)}
.dash{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(86%,140cqh);font:500 min(11px,4.4cqh)/1.3 var(--fm);color:var(--m2);padding:1.4em;border-radius:1.4em;background:rgba(17,16,20,.94);border:1px solid var(--line2);box-shadow:0 40px 80px -20px rgba(0,0,0,.75);display:flex;flex-direction:column;gap:1.1em;rotate:2deg}
.dash-h{display:flex;justify-content:space-between;align-items:center}
.dash-dots{display:flex;gap:.4em}.dash-dots i{width:.65em;height:.65em;border-radius:50%;background:var(--line3)}
.dash-k{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em}
.dash-k div{padding:.8em;border-radius:.9em;background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:.35em;min-width:0}
.dash-k b{font:700 1.55em/1 var(--fd);color:var(--ink);white-space:nowrap}
.dash-k div:first-child b{color:var(--acc)}
.dash svg{width:100%;height:auto}
.mviz{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.4em;font-size:min(16px,5cqh);text-align:center;padding:0 8%}
.mviz bdi{font:800 4.4em/1 var(--fd);letter-spacing:-.04em}
.mviz span{font:500 .9em var(--fm);color:var(--m1)}
.mviz svg{width:72%;margin-top:1em}
.crew{position:absolute;inset:0;display:grid;place-content:center;grid-template-columns:repeat(3,auto);gap:5cqh 6cqh}
.crew span{position:relative;width:21cqh;height:21cqh;border-radius:50%;display:grid;place-items:center;font:700 6.5cqh var(--fd);color:var(--bg);background:var(--av)}
.crew span b{position:absolute;inset-inline-end:-1cqh;bottom:-1cqh;width:7.5cqh;height:7.5cqh;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--bg);font-size:5cqh;box-shadow:0 0 0 1cqh var(--s1)}
.crew span b .i{stroke-width:3}
.inbox{position:absolute;inset:8% 9%;display:flex;flex-direction:column;justify-content:center;gap:2.6cqh;font:500 min(14px,4.8cqh)/1.4 var(--fb)}
.inbox p{margin:0;max-width:80%;padding:.7em 1em;border-radius:1.1em;background:rgba(255,255,255,.09);color:var(--ink2);border-end-start-radius:.3em}
.inbox p.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-end-start-radius:1.1em;border-end-end-radius:.3em}
.deck{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(80%,120cqh);aspect-ratio:16/10;font-size:min(12px,4.2cqh)}
.deck>div{position:absolute;inset:0;border-radius:1.2em;border:1px solid var(--line2);background:#16131a;box-shadow:0 30px 60px -20px rgba(0,0,0,.75)}
.deck>div:nth-child(1){rotate:-9deg;translate:-7% 5%;opacity:.45}
.deck>div:nth-child(2){rotate:-4deg;translate:-3% 2%;opacity:.75}
.deck>div:nth-child(3){padding:1.6em;display:flex;flex-direction:column;justify-content:space-between;gap:1em}
.deck b{font:700 2.2em/1.05 var(--fd);color:var(--ink)}
.deck .pills{display:flex;flex-wrap:wrap;gap:.5em}
.deck .pills span{padding:.4em .8em;border-radius:99px;border:1px solid var(--line3);font:500 .9em var(--fm);color:var(--m1)}
.vsvg{position:absolute;inset:8% 8% 24%;width:84%;height:68%}
.vsvg text{font:500 11px var(--fm);fill:var(--m2)}
.sv-cap{position:absolute;inset-inline:7%;bottom:6%;display:flex;align-items:flex-end;justify-content:space-between;gap:1em}
.sv-cap b{font:800 min(120px,22cqh)/.8 var(--fd);letter-spacing:-.05em}
.sv-cap span{display:flex;flex-direction:column;gap:.3em;text-align:end;font:700 min(34px,6cqh)/1.1 var(--fd)}
.sv-cap small{font:400 11px var(--fm);color:var(--m3)}
.step-viz .vsvg{inset:6% 6% 8%;width:88%;height:86%}
.step-viz .sv-cap{display:none}

/* services, cases */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.svc-card{min-height:260px;padding:24px;border-radius:var(--r2);background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:24px;transition:transform var(--t2) var(--ease),border-color var(--t2) var(--ease),background var(--t2) var(--ease)}
.svc-card:hover{transform:translateY(-4px);border-color:rgba(255,179,92,.5);background:var(--s2)}
.svc-top{display:flex;justify-content:space-between;align-items:center}
.svc-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,179,92,.1);color:var(--acc);font-size:22px}
.svc-card p{margin:8px 0 0;font-size:14px;line-height:1.55;color:var(--m2)}
/* ---- websites & 3D ---- */
.webs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:28px 20px}
.web{display:flex;flex-direction:column;gap:14px}
.web-shot{position:relative;display:block;aspect-ratio:16/10;border-radius:var(--r3,22px);overflow:hidden;border:1px solid var(--line2);background:var(--s1)}
.web-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease,ease)}
.web-shot:hover img{transform:scale(1.03)}
.web-bar{position:absolute;top:0;left:0;right:0;height:26px;background:rgba(8,8,10,.78);display:flex;align-items:center;gap:6px;padding:0 12px}
.web-bar i{width:7px;height:7px;border-radius:50%;background:var(--line3)}
.web-shot img{top:26px;height:calc(100% - 26px)}
.web-t{font:600 22px/1.2 var(--fd)}
.web-d{color:var(--m2);font-size:15px;line-height:1.55}
.web-links{display:flex;flex-wrap:wrap;gap:8px}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.model{display:flex;flex-direction:column;gap:12px}
.model-v{position:relative;aspect-ratio:5/4;border-radius:var(--r3,22px);overflow:hidden;border:1px solid var(--line2);background:#0e0d12}
.model-v model-viewer,.model-v img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;--poster-color:transparent}
.model-hint{position:absolute;bottom:12px;inset-inline-start:12px;padding:6px 10px;border-radius:99px;background:rgba(8,8,10,.72);border:1px solid var(--line2);font:500 11px var(--fm);letter-spacing:.06em;color:var(--ink);pointer-events:none}
/* ---- real reels (concept work) ---- */
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:28px 18px}
.reel{display:flex;flex-direction:column;gap:12px;text-align:start;width:100%}
.reel-v{position:relative;aspect-ratio:4/5;border-radius:var(--r3,22px);overflow:hidden;border:1px solid var(--line2);background:var(--s1)}
.reel-v video,.reel-v img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel:hover .reel-v{border-color:rgba(255,179,92,.5)}
.reel-tag{position:absolute;top:12px;inset-inline-start:12px;padding:6px 10px;border-radius:99px;background:rgba(8,8,10,.72);border:1px solid var(--line2);font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.reel-t{font:600 19px/1.2 var(--fd)}
.reel-d{font:500 12px/1.5 var(--fm);color:var(--m3)}
.reel-note{font:500 12px/1.6 var(--fm);color:var(--m3);margin-top:18px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:32px 20px}
.case{display:flex;flex-direction:column;gap:16px;text-align:start;width:100%}
.case:hover .viz{border-color:rgba(255,179,92,.5)}
.case-meta{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.case-meta>div{display:flex;flex-direction:column;gap:6px}
.case-ind{font:500 12px var(--fm);color:var(--m3)}
.case-t{font:600 22px/1.2 var(--fd)}
.case-m{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;text-align:end}
.case-m bdi{font:700 24px/1 var(--fd);color:var(--acc)}
.case-m span{font-size:12px;color:var(--m2)}

/* proof */
.logos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
.logos span{display:flex;align-items:center;justify-content:center;min-height:96px;padding:16px;text-align:center;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);color:var(--m2);transition:color var(--t2) var(--ease)}
.logos span:hover{color:var(--ink)}
.lg1{font:800 18px var(--fd);letter-spacing:.12em}.lg2{font:italic 600 21px Georgia,serif}.lg3{font:500 15px var(--fm);letter-spacing:.2em}.lg4{font:700 20px var(--fb);letter-spacing:-.02em}
.testis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:16px}
.testi{padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.testi blockquote{margin:0;font:500 clamp(17px,1.5vw,19px)/1.55 var(--fb);color:var(--ink2);text-wrap:pretty}
.testi blockquote::before{content:"“";display:block;font:700 56px/.6 var(--fd);margin-bottom:12px}
.testi figcaption{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--m2)}
.testi figcaption b{display:block;color:var(--ink);font-weight:600}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 15px var(--fd);color:var(--bg);background:var(--av,var(--grad))}

/* ROI */
.roi{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);border-radius:var(--r3);overflow:hidden;border:1px solid var(--line2)}
.roi-in{padding:clamp(24px,4vw,48px);background:var(--s1);display:flex;flex-direction:column;gap:26px}
.roi-out{position:relative;padding:clamp(24px,4vw,48px);background:radial-gradient(80% 60% at 100% 100%,oklch(.6 .22 355/.35),transparent 70%),radial-gradient(60% 50% at 0% 0%,oklch(.7 .17 55/.2),transparent 70%),#120f16;display:flex;flex-direction:column;gap:22px}
.roi label,.roi .lbl{font:500 13px var(--fb);color:var(--m2)}
.roi-spend{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.roi-spend bdi{font:700 28px var(--fd);color:var(--ink)}
.roi-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.roi-kpi{padding:18px;border-radius:16px;background:rgba(8,8,10,.55);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.roi-kpi span{font:500 12px var(--fm);color:var(--m2)}
.roi-kpi bdi{font:700 clamp(20px,2.2vw,28px)/1.1 var(--fd);white-space:nowrap}
.roi-kpi.big{grid-column:1/-1}
.roi-kpi.big bdi{font-size:clamp(30px,3.6vw,44px)}
.roi-rec{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line2)}
.roi-rec b{font:700 22px var(--fd)}
.note{font-size:13px;color:var(--m3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:12px 0;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2)) 0 0/var(--p,30%) 100% no-repeat,rgba(255,255,255,.12);cursor:pointer}
[dir=rtl] input[type=range]{background-position:100% 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ink);border:5px solid oklch(.7 .22 355);box-shadow:0 4px 16px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:5px solid oklch(.7 .22 355)}
@media(max-width:860px){.roi{grid-template-columns:1fr}}

/* faq */
.faq-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(24px,5vw,80px);align-items:start}
.faq{border-top:1px solid var(--line2)}
.faq details{border-bottom:1px solid var(--line2)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;cursor:pointer;font:600 clamp(17px,1.8vw,21px)/1.3 var(--fd);transition:color var(--t2) var(--ease)}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{color:var(--acc)}
.faq summary .ibtn{width:36px;height:36px;font-size:16px;transition:rotate var(--t2) var(--ease)}
.faq details[open] summary .ibtn{rotate:45deg}
.faq p{margin:0 0 24px;max-width:680px;color:var(--m1)}
@media(max-width:860px){.faq-wrap{grid-template-columns:1fr}}

/* cta band */
.band{position:relative;overflow:hidden;padding:clamp(36px,6vw,88px);border-radius:var(--r3);background:var(--s1);border:1px solid var(--line2);display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;isolation:isolate}
.band::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 70% at 90% 100%,oklch(.66 .23 355/.45),transparent 70%),radial-gradient(40% 60% at 100% 10%,oklch(.74 .17 55/.35),transparent 70%)}
[dir=rtl] .band::before{transform:scaleX(-1)}
.band h2{max-width:14ch;font-size:clamp(36px,6vw,80px);line-height:.98}

/* services page */
.acc-item{border-top:1px solid var(--line2)}
.acc-btn{width:100%;display:grid;grid-template-columns:64px 1fr 48px;gap:20px;align-items:center;padding:32px 0;text-align:start;transition:color var(--t2) var(--ease)}
.acc-btn:hover{color:var(--acc)}
.acc-t{font:600 clamp(24px,3.4vw,44px)/1.1 var(--fd)}
.acc-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:32px;padding:0 0 48px;padding-inline-start:84px;animation:pagein .35s var(--ease)}
.acc-panel p{margin:0;font-size:18px;line-height:1.6;color:var(--m1)}
.kv{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--line)}
.kv span{font:500 12px var(--fm);color:var(--m3)}
@media(max-width:700px){.acc-btn{grid-template-columns:36px 1fr 44px;gap:12px;padding:24px 0}.acc-panel{padding-inline-start:0}}

/* pricing */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:stretch}
.tier{position:relative;padding:32px;border-radius:24px;border:1px solid transparent;background:linear-gradient(var(--s1),var(--s1)) padding-box,linear-gradient(var(--line2),var(--line2)) border-box;display:flex;flex-direction:column;gap:24px;transition:transform var(--t2) var(--ease)}
.tier.feat{background:linear-gradient(#141217,#141217) padding-box,linear-gradient(140deg,var(--g1),var(--g2),var(--g3)) border-box}
.tier:hover{transform:translateY(-4px)}
.tier-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tier-h b{font:700 28px var(--fd)}
.badge{padding:6px 10px;border-radius:99px;background:var(--acc);color:var(--bg);font:600 11px var(--fm)}
.price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price{font:700 44px/1 var(--fd);letter-spacing:-.02em}
.ticks{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid var(--line);flex:1}
.ticks li{display:flex;gap:10px;align-items:flex-start;color:var(--ink2);font-size:15px;line-height:1.45}
.ticks .i{color:var(--acc);margin-top:3px}
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--s1)}
.cmp{width:100%;min-width:620px;border-collapse:collapse;font-size:15px}
.cmp th,.cmp td{padding:16px 20px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.cmp tr:last-child td{border-bottom:0}
.cmp thead th{font:600 18px var(--fd)}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center}
.cmp td:first-child{color:var(--m1)}
.cmp .i{display:inline-block;vertical-align:middle;color:var(--acc);font-size:18px}
.cmp .no{color:var(--m3)}
.cmp .hl{background:rgba(255,179,92,.05)}

/* insights */
.posts{border-top:1px solid var(--line)}
.post{display:grid;grid-template-columns:minmax(120px,170px) 1fr auto;gap:24px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line);transition:padding var(--t2) var(--ease),color var(--t2) var(--ease)}
.post:hover{padding-inline-start:12px;color:var(--acc)}
.post-meta{display:flex;flex-direction:column;gap:6px;font:500 12px var(--fm)}
.post-t{font:600 clamp(20px,2.4vw,30px)/1.2 var(--fd)}
.post-r{font-size:13px;color:var(--m3);white-space:nowrap;display:flex;align-items:center;gap:10px}
@media(max-width:700px){.post{grid-template-columns:1fr;gap:10px}.post-meta{flex-direction:row;gap:12px}}
.article{max-width:780px;margin-inline:auto}
.article .body p{font-size:clamp(17px,1.5vw,19px);line-height:1.75;color:var(--m1);margin:0 0 24px;text-wrap:pretty}
.article .body p:first-child::first-letter{font:700 3.4em/.8 var(--fd);float:inline-start;margin-inline-end:.12em;margin-top:.08em;color:var(--acc)}
.art-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font:500 12px var(--fm);color:var(--m3)}
.art-cover{aspect-ratio:21/9;margin:40px 0}
.art-cover .mviz bdi{font-size:3.4em}

/* about */
.sky{border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#0d0b10}
.sky svg{width:100%;height:auto}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:20px}
.member{display:flex;flex-direction:column;gap:12px}
.portrait{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 110%,var(--av),transparent 70%),var(--s1)}
.portrait b{font:800 clamp(56px,7vw,84px)/1 var(--fd);letter-spacing:-.04em;color:rgba(255,255,255,.9);mix-blend-mode:overlay}
.portrait svg{position:absolute;bottom:0;left:50%;translate:-50% 0;width:70%;color:rgba(8,8,10,.55)}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.values>div{padding:28px;display:flex;flex-direction:column;gap:12px}
.values p{margin:0;color:var(--m2);font-size:15px}

/* contact */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(32px,5vw,80px);align-items:start;padding-top:clamp(48px,8vw,112px)}
.cinfo{display:flex;flex-direction:column;gap:14px;padding-top:24px;border-top:1px solid var(--line);color:var(--m1)}
.cinfo a,.cinfo span{display:flex;align-items:center;gap:12px}
.cinfo .i{color:var(--acc);font-size:18px}
.cinfo a:hover{color:var(--ink)}
.mapcard{position:relative;aspect-ratio:16/9;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);background:#0e0d12}
.mapcard svg{position:absolute;inset:0;width:100%;height:100%}
.formcard{padding:clamp(20px,3vw,40px);border-radius:24px;background:var(--s1);border:1px solid var(--line2);display:flex;flex-direction:column;gap:28px}
.fsteps{display:flex;gap:8px}
.fstep{flex:1;display:flex;flex-direction:column;gap:8px;font:500 12px var(--fm);color:var(--m3)}
.fstep i{height:3px;border-radius:99px;background:var(--line2);transition:background var(--t3) var(--ease)}
.fstep.on{color:var(--ink)}
.fstep.on i{background:linear-gradient(90deg,var(--g1),var(--g2))}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:12px}
legend,.legend{padding:0;margin-bottom:12px;font:600 24px/1.2 var(--fd)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:16px 18px;border-radius:14px;border:1px solid var(--line2);font:500 15px var(--fb);text-align:start;transition:border-color var(--t2) var(--ease),background var(--t2) var(--ease)}
.opt:hover{border-color:var(--line3)}
.opt i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line3);flex:none;transition:background var(--t2) var(--ease),border-color var(--t2) var(--ease)}
.opt[aria-pressed=true]{border-color:var(--acc);background:rgba(255,179,92,.08)}
.opt[aria-pressed=true] i{border-color:var(--acc);background:var(--acc);box-shadow:inset 0 0 0 3px #1a1510}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font:500 13px var(--fb);color:var(--m2)}
.inp{height:48px;padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);font-size:15px;color:var(--ink);outline:none;transition:border-color var(--t2) var(--ease),box-shadow var(--t2) var(--ease)}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,179,92,.25)}
.inp[aria-invalid=true]{border-color:var(--err)}
.ferr{color:var(--err);font:500 13px var(--fb)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:10px 6px;border-radius:12px;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12px var(--fb);transition:background var(--t2) var(--ease),border-color var(--t2) var(--ease)}
.slot:hover{border-color:var(--line3)}
.slot bdi{font:500 14px var(--fm)}
.slot[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.factions{display:flex;justify-content:space-between;gap:12px}
.factions .next{margin-inline-start:auto}
.done{display:flex;flex-direction:column;gap:16px;padding:24px 0}
.done .orb{width:56px;height:56px}
.done b{font:700 32px/1.1 var(--fd)}
.done p{margin:0;color:var(--m1)}

/* footer */
.ftr{padding-top:120px;padding-bottom:110px;display:flex;flex-direction:column;gap:56px}
.ftr-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px;padding-top:48px;border-top:1px solid var(--line)}
.ftr-top>div{display:flex;flex-direction:column;gap:14px}
.news{display:flex;gap:8px;max-width:440px}
.news .inp{flex:1;min-width:0;border-radius:99px;padding:0 18px;background:var(--s1)}
.ftr-top .ftr-cols{display:flex;flex-direction:row;gap:clamp(32px,5vw,64px);flex-wrap:wrap;color:var(--m2);font-size:14px;line-height:2.1}
.ftr-cols>nav,.ftr-cols>div{display:flex;flex-direction:column}
.ftr-cols>div>.mono{margin-bottom:4px}
.ftr-cols a:hover{color:var(--ink)}
.soc{display:flex;gap:8px}
.ftr-bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font:400 12px var(--fm);color:var(--m3)}

/* floating */
.orb{width:30px;height:30px;border-radius:50%;flex:none;background:conic-gradient(from 200deg,var(--g1),var(--g2),var(--g3),var(--g1));animation:spin 9s linear infinite}
@keyframes spin{to{rotate:360deg}}
.fab{position:fixed;inset-inline-end:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
.fab>*{pointer-events:auto}
.fab-row{display:flex;gap:10px;align-items:center}
.wa{width:54px;height:54px;border-radius:50%;background:#25D366;color:#062b14;display:grid;place-items:center;font-size:27px;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:transform var(--t2) var(--ease)}
.wa .i{stroke-width:2}
.wa:hover{transform:translateY(-2px)}
.ask{display:flex;align-items:center;gap:10px;padding-block:10px;padding-inline:10px 18px;border-radius:99px;background:rgba(18,16,20,.9);border:1px solid var(--line3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.45);font:500 14px var(--fb);transition:transform var(--t2) var(--ease)}
.ask:hover{transform:translateY(-2px)}
.chat{width:min(380px,calc(100vw - 32px));height:min(560px,calc(100svh - 150px));border-radius:22px;background:rgba(18,16,20,.95);border:1px solid var(--line2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;animation:pagein .25s var(--ease)}
.chat[hidden]{display:none}
.chat-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.chat-h>div{display:flex;align-items:center;gap:10px}
.chat-h b{display:block;font:600 15px var(--fd)}
.chat-h small{font:400 10px var(--fm);color:var(--m3)}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{align-self:flex-start;background:rgba(255,255,255,.08);color:var(--ink2);border-end-start-radius:4px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-end-end-radius:4px}
.msg.err{color:var(--err)}
.msg-act{align-self:flex-start;display:flex;align-items:center;gap:6px;font:500 11px var(--fm);color:var(--acc)}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--m2);animation:blink 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.sugg button{padding:8px 12px;border-radius:99px;border:1px solid var(--line3);font:500 12px var(--fb);text-align:start;transition:background var(--t2) var(--ease)}
.sugg button:hover{background:rgba(255,255,255,.08)}
.chat-f{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-f .inp{flex:1;min-width:0;height:44px;border-radius:99px}
.chat-f .ibtn{background:var(--ink);color:var(--bg);border:0}
.mbar{display:none}
@media(max-width:700px){
  .mbar{position:fixed;inset-inline:0;bottom:0;z-index:45;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(8,8,10,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .mbar .btn{flex:1;min-height:46px}
  body{padding-bottom:68px}
  .fab{bottom:calc(80px + env(safe-area-inset-bottom));inset-inline-end:16px}
  .fab .wa{display:none}
  .ask .lbl{display:none}.ask{padding:8px}
  body.p-contact .mbar{display:none}
  body.p-contact{padding-bottom:0}
  body.p-contact .fab{bottom:16px}
}

/* modal */
.dlg{width:min(940px,calc(100% - 32px));max-height:calc(100svh - 40px);padding:0;border-radius:24px;background:var(--s1);border:1px solid var(--line2);overflow:auto}
.dlg::backdrop{background:rgba(4,4,6,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dlg[open]{animation:pagein .3s var(--ease)}
.dlg .viz{aspect-ratio:16/7;border-radius:0;border:0;border-bottom:1px solid var(--line)}
@media(max-width:640px){.dlg .viz{aspect-ratio:4/3}}
.dlg-b{padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:22px}
.dlg-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dlg-top>div{display:flex;flex-direction:column;gap:8px}
.dlg-t{margin:0;font:700 clamp(26px,3.4vw,40px)/1.1 var(--fd)}
.dlg-metric{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dlg-metric bdi{font:800 56px/1 var(--fd);letter-spacing:-.03em}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.cs-grid>div{padding:20px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cs-grid p{margin:0;color:var(--m1);font-size:15px;line-height:1.6}
.dlg-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}

/* misc */
.viz{display:block}
.case-meta>span:first-child{display:flex;flex-direction:column;gap:6px}
.testi{margin:0}
.faq-side{display:flex;flex-direction:column;gap:18px;position:sticky;top:110px}
@media(max-width:860px){.faq-side{position:static}}
.back{transform:scaleX(-1)}
[dir=rtl] .back{transform:none}
.phone.sm{bottom:26%}
.step-viz .phone.sm{bottom:7%}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{from{scale:.4;opacity:.8}to{scale:1.8;opacity:0}}
.story ol{display:flex;flex-direction:column}
@media(max-width:420px){
  .logo b{font-size:19px}.logo span{display:none}
  .mbar .btn{padding:0 12px;font-size:14px;gap:6px}
  .hero-in{padding-top:56px;gap:22px}
  .slots{grid-template-columns:repeat(2,1fr)}
  .roi-kpis{grid-template-columns:1fr}
  .dlg-metric bdi{font-size:44px}
}

/* reveal & motion */
.js .rv{opacity:0;transform:translateY(28px) scale(.985);transition:opacity .8s var(--ease) var(--rd,0ms),transform .9s var(--ease) var(--rd,0ms)}
.js .rv.in{opacity:1;transform:none}

/* ===== reveal families: each kind of card enters its own way ===== */
.js .rv[data-rv]{opacity:1;transform:none}
/* services: cards hinge up from a tilt */
.js .rv[data-rv=flip]{opacity:0;transform:perspective(900px) rotateX(-34deg) translateY(46px);transform-origin:50% 0;transition:opacity .7s var(--ease) var(--rd,0ms),transform 1.1s cubic-bezier(.16,1,.3,1) var(--rd,0ms)}
/* reels: footage rises behind a curtain and settles from a zoom */
.js .rv[data-rv=curtain] .reel-v{clip-path:inset(100% 0 0 0 round 22px);transition:clip-path 1.15s cubic-bezier(.77,0,.18,1) var(--rd,0ms)}
.js .rv[data-rv=curtain] .reel-v video,.js .rv[data-rv=curtain] .reel-v img{transform:scale(1.35);transition:transform 1.6s cubic-bezier(.16,1,.3,1) var(--rd,0ms)}
.js .rv[data-rv=curtain] .reel-t,.js .rv[data-rv=curtain] .reel-d{opacity:0;translate:0 12px;transition:opacity .7s var(--ease) calc(var(--rd,0ms) + .45s),translate .7s var(--ease) calc(var(--rd,0ms) + .45s)}
/* landing-page cards and service rows: slide in from alternating sides */
.js .rv[data-rv=side]{opacity:0;transform:translateX(var(--sx,-70px)) rotate(var(--sr,-2.5deg));transition:opacity .8s var(--ease) var(--rd,0ms),transform 1.1s cubic-bezier(.16,1,.3,1) var(--rd,0ms)}
/* pricing: rise, then the recommended plan lands last with a glow */
.js .rv[data-rv=rise]{opacity:0;transform:translateY(70px);transition:opacity .8s var(--ease) var(--rd,0ms),transform 1.15s cubic-bezier(.16,1,.3,1) var(--rd,0ms)}
.tier.feat.in{animation:featpop 1.4s var(--ease) calc(var(--rd,0ms) + .5s) both}
@keyframes featpop{0%{box-shadow:0 0 0 0 rgba(238,61,138,0)}35%{box-shadow:0 0 0 1px rgba(255,179,92,.6),0 24px 80px -10px rgba(238,61,138,.45)}100%{box-shadow:0 0 0 0 rgba(238,61,138,0)}}
/* values: diagonal wipe from the corner */
.js .rv[data-rv=diag]{clip-path:polygon(0 0,0 0,0 0);transition:clip-path 1.1s cubic-bezier(.77,0,.18,1) var(--rd,0ms)}
/* people: circular iris */
.js .rv[data-rv=iris] .portrait{clip-path:circle(0% at 50% 60%);transition:clip-path 1.2s cubic-bezier(.77,0,.18,1) var(--rd,0ms)}
/* call-to-action band: opens out from a pill */
.js .rv[data-rv=band]{clip-path:inset(22% 26% round 80px);opacity:.3;transition:clip-path 1.2s cubic-bezier(.77,0,.18,1),opacity .8s var(--ease)}
.js .rv[data-rv=band] h2{opacity:0;translate:0 24px;transition:opacity .8s var(--ease) .5s,translate .9s var(--ease) .5s}
/* lists (faq, insights): rows slide in one after another */
.js .rv[data-rv=list]>*,.js .rv[data-rv=list] details{opacity:0;translate:-26px 0;transition:opacity .6s var(--ease) calc(var(--i,0) * 80ms),translate .8s cubic-bezier(.16,1,.3,1) calc(var(--i,0) * 80ms)}
[dir=rtl].js .rv[data-rv=list]>*,[dir=rtl].js .rv[data-rv=list] details{translate:26px 0}
/* panels (calculator, tables, maps): unfold from the top edge */
.js .rv[data-rv=unfold]{clip-path:inset(0 0 100% 0 round 24px);transition:clip-path 1.2s cubic-bezier(.77,0,.18,1) var(--rd,0ms)}
/* stats: each figure rises in turn */
.js .rv[data-rv=count] .stat{opacity:0;translate:0 34px;transition:opacity .7s var(--ease) calc(var(--i,0) * 110ms),translate .9s cubic-bezier(.16,1,.3,1) calc(var(--i,0) * 110ms)}
/* end states */
.js .rv[data-rv].in{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 0)}
.js .rv[data-rv=diag].in{clip-path:polygon(0 0,220% 0,0 220%)}
.js .rv[data-rv=band].in{clip-path:inset(0 0 round 28px)}
.js .rv[data-rv=curtain].in .reel-v{clip-path:inset(0 0 0 0 round 22px)}

/* ---------- routing ---------- */
const href = (page = 'home', id = null, q = null) => {
  let h = '#/' + (S.lang === 'ar' ? 'ar/' : '') + (page === 'home' ? '' : page) + (id != null ? '/' + id : '');
  if (q) { const qs = new URLSearchParams(q).toString(); if (qs) h += '?' + qs; }
  return h;
};
function parse() {
  const h = location.hash.slice(1);
  if (!h.startsWith('/')) return null;
  const [p, qs] = h.slice(1).split('?');
  const seg = p.split('/').filter(Boolean);
  let lang = 'en';
  if (seg[0] === 'ar') { lang = 'ar'; seg.shift(); }
  const page = seg[0] || 'home';
  return { lang, page: page === 'home' || PAGES.includes(page) ? page : '404', id: seg[1] != null ? seg[1] : null, query: Object.fromEntries(new URLSearchParams(qs || '')) };
}
function nav(page, q = null, id = null) {
  const h = href(page, id, q);
  if (location.hash === h) route(); else location.hash = h;
}
let lastLang = null, booted = false;
function route() {
  let r = parse();
  if (!r) {
    const pref = store.get('wj-lang') || ((navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en');
    r = { lang: pref, page: 'home', id: null, query: {} };
    if (pref === 'ar') history.replaceState(null, '', '#/ar/');
  }
  Object.assign(S, { lang: r.lang, page: r.page, id: r.id, query: r.query });
  if (S.page === 'work') S.workFilter = BENCH[r.query.ind] ? r.query.ind : 'all';
  if (S.page === 'services' && r.query.s != null && SV[+r.query.s]) S.svcOpen = +r.query.s;
  if (S.page === 'insights') S.postCat = T.en.cats[r.query.cat] ? r.query.cat : 'all';
  if (lastLang !== S.lang) { lastLang = S.lang; applyLang(); renderShell(); }

  const dlg = $('#caseDlg');
  if (S.page === 'work' && S.id != null && CASES[+S.id]) openCase(+S.id);
  else if (dlg.open) dlg.close();
  window.scrollTo(0, 0);
  if (booted) { const h1 = $('#main h1'); if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); } }
  booted = true;
}

function skyline() {

/* ---------- contact form ---------- */
function slotList() {
  const L = S.lang, out = [], d = new Date();
  d.setHours(12, 0, 0, 0);
  while (out.length < 9) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    if (wd === 0 || wd === 6) continue;
    const day = d.toLocaleDateString(L === 'ar' ? 'ar-AE-u-nu-latn' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const dayEn = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    for (const tm of ['10:00', '13:00', '16:00']) out.push({ day, dayEn, time: tm, key: d.toDateString() + ' ' + tm });
  }
  return out;
}
function field(k, label, type, ac) {
  const f = S.f, e = f.errors[k];
  return `<label class="field">${label}<input class="inp" id="f-${k}" data-f="${k}" type="${type}"${type !== 'text' ? ' dir="ltr"' : ''} autocomplete="${ac}" value="${esc(f.form[k])}"${k === 'phone' ? ' placeholder="+971 50 000 0000"' : ''} aria-invalid="${!!e}"${e ? ` aria-describedby="e-${k}"` : ''}>${e ? `<span class="ferr" id="e-${k}">${e}</span>` : ''}</label>`;
}
function formHTML() {
  const t = tt(), f = S.f, e = f.errors;
  if (f.sent) {
    const slot = slotList().find(x => x.key === f.slot);
    return `<div class="done" role="status"><span class="orb"></span><b>${t.sentTitle}</b><p>${esc(t.sentBody(f.form.name.trim().split(/\s+/)[0], slot ? slot.day + ' · ' + slot.time : '', f.form.email.trim()))}</p><button class="link" data-act="reset">${t.another}</button></div>`;
  }
  const bar = `<div class="fsteps" aria-hidden="true">${t.steps.map((s, i) => `<div class="fstep${i <= f.step ? ' on' : ''}"><i></i>${s}</div>`).join('')}</div>`;
  let body = '';
  if (f.step === 0) body = `<fieldset><legend>${t.qGoals}</legend><div class="chips">${t.goals.map((g, i) => `<button type="button" class="chip" data-act="goal" data-i="${i}" aria-pressed="${f.goals.includes(i)}">${g}</button>`).join('')}</div>${e.goals ? `<span class="ferr" role="alert">${e.goals}</span>` : ''}</fieldset>`;
  if (f.step === 1) body = `<fieldset><legend>${t.qBudget}</legend><div class="opts">${t.budgets.map((b, i) => `<button type="button" class="opt" data-act="budget" data-i="${i}" aria-pressed="${f.budget === i}"><bdi>${b}</bdi><i></i></button>`).join('')}</div>${e.budget ? `<span class="ferr" role="alert">${e.budget}</span>` : ''}</fieldset>`;
  if (f.step === 2) body = `<div style="display:flex;flex-direction:column;gap:16px"><span class="legend">${t.qDetails}</span><div class="fields">${field('name', t.fName, 'text', 'name')}${field('company', t.fCompany, 'text', 'organization')}${field('email', t.fEmail, 'email', 'email')}${field('phone', t.fPhone, 'tel', 'tel')}</div>
    <span class="field" id="slotL" style="margin-top:4px">${t.fSlot}</span><div class="slots" role="group" aria-labelledby="slotL">${slotList().map(s => `<button type="button" class="slot" data-act="slot" data-k="${s.key}" aria-pressed="${f.slot === s.key}"><span>${s.day}</span><bdi>${s.time}</bdi></button>`).join('')}</div>${e.slot ? `<span class="ferr" role="alert">${e.slot}</span>` : ''}</div>`;
  return `<form class="lead-form" data-form="lead" novalidate style="display:flex;flex-direction:column;gap:28px">${bar}${body}${e.submit ? `<span class="ferr" role="alert">${e.submit}</span>` : ''}<div class="factions">${f.step > 0 ? `<button type="button" class="btn btn-ghost" data-act="back">${t.back}</button>` : ''}<button type="submit" class="btn btn-grad next"${f.sending ? ' disabled' : ''}>${f.sending ? t.sending : f.step === 2 ? t.send : t.nextL} ${arrow()}</button></div></form>`;
}
function renderForm(focusSel) {
  const box = $('#formCard'); if (!box) return;
  const a = document.activeElement;
  const keep = focusSel || (a && box.contains(a) ? (a.id ? '#' + a.id : a.dataset.act ? `[data-act="${a.dataset.act}"]${a.dataset.i != null ? `[data-i="${a.dataset.i}"]` : ''}${a.dataset.k ? `[data-k="${a.dataset.k}"]` : ''}` : null) : null);
  box.innerHTML = formHTML();
  const el = keep && $(keep, box);
  if (el) el.focus();
}
function validate() {
  const t = tt(), f = S.f, e = {};
  if (f.step === 0 && !f.goals.length) e.goals = t.eGoals;
  if (f.step === 1 && f.budget == null) e.budget = t.eBudget;
  if (f.step === 2) {
    if (!f.form.name.trim()) e.name = t.eName;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.form.email.trim())) e.email = t.eEmail;
    if ((f.form.phone.match(/\d/g) || []).length < 9) e.phone = t.ePhone;
    if (!f.slot) e.slot = t.eSlot;
  }
  return e;
}
const announce = msg => { const l = $('#live'); l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 30); };
async function formNext() {
  const f = S.f, e = validate();
  if (Object.keys(e).length) {
    f.errors = e; renderForm();
    const first = $('#formCard [aria-invalid="true"]') || $('#formCard .chip, #formCard .opt, #formCard .slot');
    if (first) first.focus();
    return;
  }
  f.errors = {};
  if (f.step < 2) {
    f.step++; renderForm();
    announce(tt().stepOf(f.step + 1));
    const first = $('#formCard .chip, #formCard .opt, #formCard .inp'); if (first) first.focus();
    return;
  }
  f.sending = true; renderForm();
  const slot = slotList().find(x => x.key === f.slot);
  const payload = { name: f.form.name.trim(), company: f.form.company.trim(), email: f.form.email.trim(), phone: f.form.phone.trim(), goals: f.goals.map(i => T.en.goals[i]).join(', '), budget: T.en.budgets[f.budget], call: slot ? `${slot.dayEn} ${slot.time} GST` : '', language: S.lang };
  let ok = true;
  if (CONFIG.formEndpoint) {
    try { const r = await fetch(CONFIG.formEndpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload) }); ok = r.ok; } catch (err) { ok = false; }
  } else {
    const body = Object.entries(payload).map(([k, v]) => `${k}: ${v}`).join('\n');
    location.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent('New project request: ' + payload.name)}&body=${encodeURIComponent(body)}`;
  }
  f.sending = false;
  if (ok) { f.sent = true; renderForm(); const d = $('#formCard .done'); if (d) { d.setAttribute('tabindex', '-1'); d.focus(); } }
  else { f.errors = { submit: tt().eSubmit }; renderForm(); }
}

      { Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1200))]).then(() => requestAnimationFrame(go)); }

      const apply = () => order.forEach((ci, slot) => {

        if (slot === 0 && motion) { if (!v.getAttribute('src')) { v.src = v.dataset.src; v.addEventListener('playing', () => v.classList.add('live'), { once: true }); } v.currentTime = 0; v.play().catch(() => {}); } else v.pause();

    }
  }

  if (rvids.length && motion) {
    const pio = new IntersectionObserver(es => es.forEach(e => { const v = e.target; if (e.isIntersecting) { if (!v.getAttribute('src')) v.src = v.dataset.src; v.play().catch(() => {}); } else v.pause(); }), { threshold: .35 });
    rvids.forEach(v => pio.observe(v)); M.io.push(pio);
  }

  if (show) {
    const dev = $('#dev', show), vid = $('#showVid', show), poster = $('#showPoster', show), wipe = $('#showWipe', show), tabs = $$('.show-tabs button', show);
    const small = () => matchMedia('(max-width:760px)').matches;
    let cur = 0, vis = false;
    const srcFor = i => `media/web/${WEBS[i].img}-${small() ? 'm' : 'd'}.mp4`;
    const load = i => { vid.classList.remove('live'); poster.src = `media/web/${WEBS[i].img}${small() ? '-m' : ''}.jpg`; if (!motion) return; vid.src = srcFor(i); if (vis) vid.play().catch(() => {}); };
    vid.addEventListener('playing', () => vid.classList.add('live'));
    vid.addEventListener('error', () => vid.classList.remove('live'));
    const pick = i => {
      if (i === cur) return; cur = i; const w = WEBS[i], x = w[S.lang];
      tabs.forEach((b, k) => b.setAttribute('aria-selected', k === i ? 'true' : 'false'));
      show.style.setProperty('--sg1', w.c[0]); show.style.setProperty('--sg2', w.c[1]);
      $('#showD', show).textContent = x[2]; $('#showGo', show).href = w.url; vid.setAttribute('aria-label', x[0]);
      if (motion) { wipe.classList.remove('go'); void wipe.offsetWidth; wipe.classList.add('go'); setTimeout(() => load(i), 380); } else load(i);

    tabs.forEach((b, k) => { b.addEventListener('click', () => pick(k)); b.addEventListener('keydown', e => { const d = (e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0) * (S.lang === 'ar' ? -1 : 1); if (d) { e.preventDefault(); const n = (cur + d + tabs.length) % tabs.length; tabs[n].focus(); pick(n); } }); });
    poster.src = `media/web/${WEBS[0].img}${small() ? '-m' : ''}.jpg`;
    const vio = new IntersectionObserver(es => { vis = es[0].isIntersecting; if (!motion) return; if (vis) { if (!vid.getAttribute('src')) vid.src = srcFor(cur); vid.play().catch(() => {}); } else vid.pause(); }, { rootMargin: '200px 0px' });
    vio.observe(dev); M.io.push(vio);
    if (motion && window.ScrollTrigger) { dev.style.setProperty('--t', 1); M.st.push(ScrollTrigger.create({ trigger: dev, start: 'top 95%', end: 'top 30%', scrub: .6, onUpdate: self => dev.style.setProperty('--t', (1 - self.progress).toFixed(4)) })); }
  }
  const story = $('#story');
  if (story && window.ScrollTrigger && storyActive()) {

}
function loop(now) {
  requestAnimationFrame(loop);
  if (document.hidden) return;
  const motion = motionOn();

  const G = M.gl;
  if (G && motion && M.heroVis) {
    const dpr = .5, c = G.canvas, w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr);
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    G.gl.viewport(0, 0, w, h); G.gl.uniform2f(G.uR, w, h); G.gl.uniform1f(G.uT, (now - M.t0) / 1000); G.gl.uniform2f(G.uM, M.mc.x, M.mc.y);
    G.gl.drawArrays(G.gl.TRIANGLES, 0, 6);
    if (!G.drawn) { G.drawn = true; c.classList.add('on'); }
  }
  const y = scrollY; M.vel += (Math.abs(y - M.lastY) - M.vel) * .12; M.lastY = y;
  const ht = M.heroVis && $('#heroT');
  if (ht) { /* weight stays fixed: no twitch while scrolling */ }
  const dk = M.heroVis && $('#heroReels');
  if (dk && motion) { const k = ((M.mc.x - .5) * 2).toFixed(2) + '|' + (-(M.mc.y - .5) * 2).toFixed(2) + '|' + Math.min(1, y / innerHeight).toFixed(2); if (k !== M.dk) { M.dk = k; const [a, b2, c2] = k.split('|'); dk.style.setProperty('--px', a); dk.style.setProperty('--py', b2); dk.style.setProperty('--sp', c2); } }
  const mq = $('#marq');
  if (mq && motion) { const half = mq.scrollWidth / 2, dir = S.lang === 'ar' ? 1 : -1; M.mq = (M.mq + dir * (.6 + Math.min(M.vel * .4, 8))) % half; mq.style.transform = `translateX(${M.mq}px)`; }
  if (!window.ScrollTrigger && storyActive()) {
    const st = $('#story');

}
function tweenNum(el, from, to) {
  if (!motionOn() || from === to) { el.textContent = priceText(to); return; }
  const o = { v: from };
  if (window.gsap) gsap.to(o, { v: to, duration: .5, ease: 'power2.out', onUpdate: () => { el.textContent = priceText(Math.round(o.v / 10) * 10); }, onComplete: () => { el.textContent = priceText(to); } });
  else el.textContent = priceText(to);
}

function renderMain() {
  teardownMotion();
  document.body.className = 'p-' + S.page;
  const t = tt();
  const view = VIEWS[S.page] || vNotFound;
  $('#main').innerHTML = `<div class="page">${view()}</div>`;
  let title = S.page === 'home' ? (S.lang === 'ar' ? 'وهجورة ديجيتال · وكالة تواصل اجتماعي في دبي' : 'WAHJORA Digital · Social media agency in Dubai') : `${t.nav[S.page] || '404'} · WAHJORA Digital`;
  if (S.page === 'insights' && S.id != null && POSTS[+S.id]) title = `${POSTS[+S.id][S.lang][0]} · WAHJORA Digital`;
  document.title = title;
  $('meta[name="description"]').setAttribute('content', t.desc[S.page] || t.desc.home);
  afterRender();
}

/* ---------- events ---------- */
function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el) {
      const act = el.dataset.act, i = +el.dataset.i, v = el.dataset.v;
      switch (act) {
        case 'skip': e.preventDefault(); $('#main').focus(); break;
        case 'lang': switchLang(v); break;
        case 'menu': $('#menuDlg').showModal(); break;
        case 'menu-close': $('#menuDlg').close(); break;
        case 'case': openCase(i); break;
        case 'case-nav': openCase(i); break;
        case 'case-close': $('#caseDlg').close(); break;
        case 'similar': $('#caseDlg').close(); S.f.sent = false; break;
        case 'svc':
          S.svcOpen = S.svcOpen === i ? null : i;
          $('#svcList').innerHTML = svcList();
          $(`#svcb${i}`).focus();
          history.replaceState(null, '', href('services', null, S.svcOpen != null ? { s: S.svcOpen } : null));
          break;
        case 'billing': {
          if (S.billing === v) break;
          const before = TIERS.map((_, k) => tierPrice(k));
          S.billing = v;
          $$('[data-act="billing"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
          $$('.price[data-i]').forEach(p => tweenNum(p, before[+p.dataset.i], tierPrice(+p.dataset.i)));
          break;
        }
        case 'filter':
          S.workFilter = v;
          $$('[data-act="filter"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
          $('#caseGrid').innerHTML = caseGrid();
          $$('#caseGrid .rv').forEach(x => x.classList.add('in'));
          history.replaceState(null, '', href('work', null, workQ()));
          break;
        case 'cat':
          S.postCat = v;
          $$('[data-act="cat"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
          $('#postList').innerHTML = postList();
          history.replaceState(null, '', href('insights', null, v !== 'all' ? { cat: v } : null));
          break;
        case 'goal': { const g = S.f.goals; S.f.goals = g.includes(i) ? g.filter(x => x !== i) : [...g, i]; S.f.errors.goals = null; renderForm(); break; }
        case 'budget': S.f.budget = i; S.f.errors.budget = null; renderForm(); break;
        case 'slot': S.f.slot = el.dataset.k; S.f.errors.slot = null; renderForm(); break;
        case 'back': S.f.step = Math.max(0, S.f.step - 1); S.f.errors = {}; renderForm(); announce(tt().stepOf(S.f.step + 1)); break;
        case 'reset': S.f = freshForm(); renderForm('.chip'); break;
        case 'choose': S.f = { ...freshForm(), budget: [0, 1, 2][i], goals: S.f.goals }; break;
        case 'roi-goal': S.roi.goal = v; updateRoi(); break;
        case 'roi-ind': S.roi.ind = v; updateRoi(); break;
        case 'roi-cta': S.f = { ...freshForm(), goals: [S.roi.goal === 'awareness' ? 0 : 1], budget: roiTier() }; break;
        case 'chat': setChat(!S.chat.open); break;
        case 'chat-close': setChat(false); break;
        case 'sugg': ask(tt().sugg[i]); break;
      }
    }
    const a = e.target.closest('a[href^="#/"]');
    if (a) {
      if ($('#menuDlg').open) $('#menuDlg').close();
      const h = a.getAttribute('href');

    }

  document.addEventListener('submit', async e => {
    const f = e.target.closest('[data-form]'); if (!f) return;
    e.preventDefault();
    const kind = f.dataset.form, t = tt();

  document.addEventListener('input', e => {

    if (k) {
      S.f.form[k] = e.target.value;

  }, { passive: true });
